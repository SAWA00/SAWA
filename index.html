<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sawa Travel — Trip Pricing</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#f6f2fa;--cream:#ece5f3;--ink:#2b143a;--brown:#5a3d73;
  --gold:#9b6bc3;--gold-light:#dcc6f0;--gold-pale:#f4ecfa;
  --green:#2d6a4f;--green-l:#52b788;--red:#9b2226;
  --muted:#7d6e8c;--border:#ddd2e8;--white:#fff;
  --r:6px;--shadow:0 4px 24px rgba(43,20,58,.1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--sand);font-family:DM Sans,sans-serif;color:var(--ink);min-height:100vh}

/* ── HEADER ── */
.hdr{background:var(--ink);color:var(--sand);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:62px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:.7rem}
.logo-img{height:42px;width:auto;background:#fff;border-radius:8px;padding:2px 6px}
.logo-icon{width:30px;height:30px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.95rem}
.logo-txt{font-family:Playfair Display,serif;font-size:1rem}
.logo-sub{font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-light);margin-top:1px}
.rate-pill{background:rgba(155,107,195,.2);border:1px solid rgba(155,107,195,.4);color:var(--gold-light);padding:.2rem .6rem;border-radius:3px;font-size:.65rem;font-weight:600;cursor:pointer}

/* ── HERO ── */
.hero{background:linear-gradient(135deg,var(--ink) 0%,#3a1d4f 60%,#4b2560 100%);padding:2rem 2rem 1.8rem;color:var(--sand);position:relative;overflow:hidden}
.hero::before{content:'☪';position:absolute;right:2rem;top:50%;transform:translateY(-50%);font-size:8rem;opacity:.04}
.hero-eye{font-size:.58rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:.4rem}
.hero h1{font-family:Playfair Display,serif;font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hero h1 em{color:var(--gold-light);font-style:italic}
.hero-sub{font-size:.8rem;color:rgba(247,243,238,.5);margin-top:.3rem}

/* ── LAYOUT ── */
.wrap{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 62px - 130px)}

/* ── LEFT PANEL ── */
.left{background:var(--white);border-right:1px solid var(--border);padding:1.5rem;display:flex;flex-direction:column;gap:1.2rem}
.card{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.card-hdr{background:var(--cream);padding:.55rem 1rem;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card-body{padding:.9rem 1rem;display:flex;flex-direction:column;gap:.65rem}

/* inputs */
label{font-size:.68rem;color:var(--muted);font-weight:500;display:block;margin-bottom:.22rem}
label span{color:var(--gold);font-size:.58rem;margin-left:.25rem}
input[type=number],input[type=text],select,textarea{width:100%;padding:.5rem .65rem;border:1.5px solid var(--border);border-radius:4px;font-family:DM Sans,sans-serif;font-size:.8rem;color:var(--ink);background:var(--white);transition:border-color .15s;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(155,107,195,.1)}
textarea{resize:vertical;min-height:84px;line-height:1.45}
input.ro{background:var(--cream);color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}

/* margin slider */
.sl-row{display:flex;align-items:center;gap:.65rem}
input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:var(--border);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sl-val{font-size:.82rem;font-weight:600;color:var(--green);min-width:36px;text-align:right}

/* ── ROOM GROUPS SECTION ── */
.group-list{display:flex;flex-direction:column;gap:.6rem}
.grp-row{display:grid;grid-template-columns:auto 80px 70px 36px;align-items:center;gap:.4rem;padding:.5rem .7rem;background:var(--sand);border:1.5px solid var(--border);border-radius:4px}
.grp-type{font-size:.78rem;font-weight:600;color:var(--ink)}
.grp-pax{font-size:.7rem;color:var(--muted)}
.grp-price{font-size:.78rem;font-weight:600;color:var(--green)}
.del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:0 4px;border-radius:3px;transition:color .15s}
.del-btn:hover{color:var(--red)}
.add-row{display:grid;grid-template-columns:1fr 80px 36px;gap:.4rem}
.add-btn{background:var(--ink);color:var(--sand);border:none;border-radius:4px;padding:.45rem .5rem;font-size:.72rem;font-weight:600;cursor:pointer;letter-spacing:.04em;transition:background .15s}
.add-btn:hover{background:var(--brown)}

/* action button */
.calc-btn{background:var(--gold);color:var(--ink);border:none;border-radius:var(--r);padding:.8rem;font-family:DM Sans,sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;letter-spacing:.05em;text-transform:uppercase;width:100%;transition:all .15s}
.calc-btn:hover{background:#b8880f;transform:translateY(-1px)}

/* ── RIGHT PANEL ── */
.right{padding:1.8rem 2rem;display:flex;flex-direction:column;gap:1.4rem}

/* hero result strip */
.res-hero{background:var(--ink);border-radius:10px;padding:1.6rem;color:var(--sand);display:flex;gap:1.5rem;position:relative;overflow:hidden;flex-wrap:wrap}
.res-hero::after{content:'';position:absolute;top:0;right:0;width:180px;height:100%;background:radial-gradient(ellipse at right,rgba(155,107,195,.12),transparent 70%)}
.rstat{}
.rstat-lbl{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(247,243,238,.4);margin-bottom:.35rem}
.rstat-val{font-family:Playfair Display,serif;font-size:1.7rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.rstat-note{font-size:.62rem;color:rgba(247,243,238,.35);margin-top:.25rem}
.gold-c{color:var(--gold-light)}.green-c{color:#74c69d}.blue-c{color:#7ec8f0}

/* group summary table */
.tbl-wrap{background:var(--white);border:1px solid var(--border);border-radius:var(--r);}
.tbl-hdr{background:var(--cream);padding:.6rem 1.1rem;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{font-size:.57rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);text-align:right;padding:.5rem .8rem;border-bottom:1.5px solid var(--ink)}
th:first-child{text-align:left}
td{padding:.55rem .8rem;text-align:right;border-bottom:1px solid rgba(221,213,200,.4);font-variant-numeric:tabular-nums}
td:first-child{text-align:left;color:var(--muted);font-size:.7rem}
tr.total-row td{border-top:1.5px solid var(--ink);border-bottom:none;font-weight:700;color:var(--ink)}
tr.sale-row td{color:var(--green);font-weight:700}
tr.profit-row td{color:var(--gold);font-weight:700}
.gc{color:var(--green)}.rc{color:var(--red)}.goldc{color:var(--gold)}

/* cost breakdown per type */
.breakdown-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.bk-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.bk-card-hdr{padding:.6rem 1rem;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--sand);font-weight:600}
.bk-card-body{padding:.9rem 1rem}
.bk-row{display:flex;justify-content:space-between;align-items:center;padding:.38rem 0;border-bottom:1px solid rgba(221,213,200,.4);font-size:.78rem}
.bk-row:last-child{border-bottom:none}
.bk-label{color:var(--muted)}
.bk-val{font-weight:500}
.bk-row.subtot{border-top:1px dashed var(--border);padding-top:.5rem;font-weight:600;color:var(--brown)}
.bk-row.tot{border-top:2px solid var(--ink);padding-top:.65rem;font-weight:700;font-size:.85rem}
.bk-row.sale{color:var(--green);font-weight:700}
.bk-row.profit{color:var(--gold);font-weight:700}

/* action bar */
.action-bar{display:flex;gap:.75rem;flex-wrap:wrap}
.act-btn{display:flex;align-items:center;gap:.4rem;border:1.5px solid var(--border);border-radius:var(--r);padding:.5rem 1rem;font-family:DM Sans,sans-serif;font-size:.72rem;color:var(--muted);cursor:pointer;background:var(--white);transition:all .15s}
.act-btn:hover{border-color:var(--gold);color:var(--gold)}
.act-btn.primary{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600}
.act-btn.primary:hover{background:#b8880f}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;color:var(--muted);gap:.6rem;text-align:center}
.empty-icon{font-size:2.8rem;opacity:.25}

/* modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(43,20,58,.55);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:10px;padding:1.4rem;width:300px;box-shadow:var(--shadow)}
.modal h3{font-family:Playfair Display,serif;margin-bottom:.9rem;font-size:1.1rem}
.modal-close{float:right;background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--muted)}
.modal-fld{margin-bottom:.65rem}
.modal-fld label{font-size:.7rem;color:var(--muted);margin-bottom:.25rem;display:block}
.modal-btn{background:var(--ink);color:var(--sand);border:none;border-radius:4px;padding:.6rem 1.1rem;font-family:DM Sans,sans-serif;font-size:.8rem;cursor:pointer;width:100%;margin-top:.5rem}

@page {
  margin: 0.8cm;
  /* Some browsers support these to hide URL/date headers */
}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.left{border-right:none;border-bottom:1px solid var(--border)}}

/* ── OVERLAY CONTENT STYLES ── */
.conf-hdr{background:#2b143a;color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between}
.conf-badge{background:#9b2226;color:#fff;font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding:4px 10px;border-radius:3px;font-weight:600}
#offerContent table,#costContent table{width:100%;border-collapse:collapse}
#offerContent th,#costContent th{background:#f0e9de;padding:8px 12px;text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5a3d73;font-weight:600;border-bottom:2px solid #9b6bc3}
.r{text-align:right}
#offerContent td,#costContent td{padding:8px 12px;border-bottom:1px solid #eee;vertical-align:top;font-variant-numeric:tabular-nums}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#eee}
.kpi{background:#fff;padding:14px 16px}
.kpi-l{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#7d6e8c;margin-bottom:5px}
.kpi-v{font-family:Playfair Display,serif;font-size:1.35rem;font-weight:700}
.section-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7d6e8c;font-weight:600;padding:12px 20px 6px;border-top:1px solid #eee}
.body-pad{padding:16px 24px}
tr.subtot td{background:#f4ecfa;font-weight:600;color:#5a3d73}
tr.totrow td{background:#2b143a;color:#fff;font-weight:700}
tr.salerow td{background:#2d6a4f;color:#fff;font-weight:700}
tr.profrow td{background:#9b6bc3;color:#2b143a;font-weight:700}

  +'<div class="g3" style="margin-top:.5rem"><div><label>Currency</label><select'+d+'"c"><option value="">'+v('cur')+' (main)</option>'+['SAR','USD','EUR','AED','TRY','EGP','GBP'].filter(function(o){return o!=v('cur')}).map(function(o){return'<option'+(o==r.c?' selected':'')+'>'+o+'</option>'}).join('')+'</select></div><div><label>1 '+v('cur')+' = ? (rate)</label><input type="number" min="0" step="any"'+d+'"x" value="'+(r.x||'')+'" placeholder="'+(r.c&&r.c==v('lcur')?num('rate'):'rate')+'"></div></div></div>'}).join('')}
 R(TR,'trs',1);R(EX,'exs',0)}
function addR(A){A.push(A==TR?{m:'Bus',l:'',d:'',t:'',p:0,b:'Total',c:'',x:0}:{l:'',p:0,b:'Total',c:'',x:0});rows();recalc()}
function delR(A,i){A.splice(i,1);rows();recalc()}
function sync(t){var id=t&&t.id||'',rate=num('rate')||1,o;
 if(/^rL\d$/.test(id)){o=id.slice(2);$('rM'+o).value=t.value===''?'':(num(id)/rate).toFixed(2)}
 else if(/^rM\d$/.test(id)){o=id.slice(2);$('rL'+o).value=t.value===''?'':(num(id)*rate).toFixed(2)}
 else if(id=='rate'||id=='lcur'||id=='cur'){if(id!='rate')rows();if(id!='rate'&&v('lcur')==v('cur'))$('rate').value=1;rate=num('rate')||1;for(o=1;o<=4;o++)if(v('rL'+o)!=='')$('rM'+o).value=(num('rL'+o)/rate).toFixed(2)}
 else if(id=='mgR')$('margin').value=t.value;else if(id=='margin')$('mgR').value=t.value;
 else if(id=='t_ad'||id=='t_rd'){var a=v('t_ad'),b=v('t_rd');if(a&&b)$('nts').value=Math.max(0,Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5))}
 document.querySelectorAll('.lc').forEach(function(e){e.textContent=v('lcur')});document.querySelectorAll('.mc').forEach(function(e){e.textContent=v('cur')});
 ['a_stay','a_fl','a_tr','a_ex'].forEach(function(k){$('b_'+k).style.display=v(k)?'':'none'})}
function onIn(e){var t=e.target;if(t.dataset&&t.dataset.r){var A=t.dataset.r=='trs'?TR:EX,k=t.dataset.k;A[+t.dataset.i][k]=(k=='p'||k=='x')?(parseFloat(t.value)||0):t.value}else if(!t.hasAttribute||!t.hasAttribute('data-s')&&t.id!='mgR')return;sync(t);recalc()}
document.addEventListener('input',onIn);document.addEventListener('change',onIn);
function cv(r){var p=+r.p||0;if(!r.c||r.c==v('cur'))return p;var x=+r.x||(r.c==v('lcur')?num('rate'):0);return x?p/x:0}
function model(){var mk=1+num('margin')/100,st=+v('round')||1,n=num('nts'),L=[],pax=0,o;for(o=1;o<=4;o++)pax+=num('pax'+o);
 var ad=v('a_fl')?num('fa_n'):0,trav=Math.max(v('a_stay')?pax:0,ad)+(v('a_fl')?num('fc_n'):0),rooms={};
 function U(c){return Math.ceil(c*mk/st-1e-9)*st}
 function add(sec,label,qty,cost,x){if(qty>0&&cost>0)L.push(Object.assign({sec:sec,label:label,qty:qty,cost:cost,u:U(cost)},x||{}))}
 if(v('a_stay'))for(o=1;o<=4;o++){var c=num('rM'+o)*n/o;rooms[o]={cost:c,u:c>0?U(c):0};add('Hotel',ROOM[o]+' room — per person ('+n+' nights)',num('pax'+o),c,{o:o})}
 if(v('a_fl')){add('Flights','Flight — adult',num('fa_n'),num('fa_p'),{k:'a'});add('Flights','Flight — child',num('fc_n'),num('fc_p'),{k:'c'});add('Flights','Flight — infant',num('fi_n'),num('fi_p'),{k:'i'})}
 if(v('a_tr'))TR.forEach(function(r){add('Transfers',r.m+' — '+(r.l||'transfer'),r.b=='Per person'?trav:1,cv(r),{r:r})});
 if(v('a_ex'))EX.forEach(function(r){add('Extras',r.l||'Extra',r.b=='Per person'?trav:1,cv(r),{r:r})});
 var tc=0,ts=0,sec={};L.forEach(function(l){l.tc=l.qty*l.cost;l.ts=l.qty*l.u;tc+=l.tc;ts+=l.ts;var s=sec[l.sec]=sec[l.sec]||{c:0,s:0};s.c+=l.tc;s.s+=l.ts});
 var shared=trav?L.filter(function(l){return l.sec=='Transfers'||l.sec=='Extras'}).reduce(function(a,l){return a+l.ts},0)/trav:0,fa=L.filter(function(l){return l.k=='a'})[0],pk=[];
 for(o in rooms)if(rooms[o].u>0)pk.push({o:+o,hot:rooms[o].u,all:Math.ceil((rooms[o].u+(fa?fa.u:0)+shared)/st-1e-9)*st});
 return{L:L,tc:tc,ts:ts,sec:sec,trav:trav,inf:v('a_fl')?num('fi_n'):0,rooms:rooms,pk:pk,n:n}}
function recalc(){for(var o=1;o<=4;o++){var c=num('rM'+o)*num('nts')/o;$('rn'+o).textContent=c>0?'Cost per person = '+money(c)+' ('+money(num('rM'+o))+' × '+num('nts')+' nights ÷ '+o+')':''}save();if(shown)render()}
function calcNow(){shown=true;render();$('res').scrollIntoView({behavior:'smooth'})}
function why(){var w=[],o;
 if(v('a_stay')){var pr=0,px=0;for(o=1;o<=4;o++){pr+=num('rM'+o);px+=num('pax'+o)}
  if(pr<=0)w.push('Hotel: enter a room price per night.');else{if(num('nts')<=0)w.push('Hotel: enter the arrival &amp; return dates (or the number of nights).');if(px<=0)w.push('Hotel: enter how many persons are in each room type.')}}
 if(v('a_fl')&&!(num('fa_n')*num('fa_p')||num('fc_n')*num('fc_p')||num('fi_n')*num('fi_p')))w.push('Flights: enter the number of passengers and the ticket price.');
 return w}
function render(){var M=model(),W=why();if(!M.L.length&&!M.pk.length){$('empty').style.display='flex';$('res').style.display='none';$('empty').innerHTML='<div class="empty-icon">⚠️</div><div style="font-size:.85rem;max-width:330px;line-height:1.6">'+(W.length?W.join('<br>'):'Nothing to price yet. Tick Add on a section and enter its prices.')+'</div>';return}
 $('empty').style.display='none';$('res').style.display='flex';var pr=M.ts-M.tc;
 $('warn').innerHTML=W.length?'<div style="background:#fff7e0;border:1.5px solid #e8d08a;border-radius:10px;padding:.6rem .8rem;color:#6b5400;font-size:.75rem;line-height:1.6">⚠️ '+W.join('<br>⚠️ ')+'</div>':'';
 $('hero').innerHTML='<div class="rstat"><div class="rstat-lbl">Travellers</div><div class="rstat-val">'+M.trav+'</div><div class="rstat-note">'+(M.inf?'+ '+M.inf+' infant'+(M.inf>1?'s':''):'adults + children')+'</div></div>'
 +'<div class="rstat"><div class="rstat-lbl">Total Price</div><div class="rstat-val gold-c">'+money(M.ts,0)+'</div><div class="rstat-note">Sales price</div></div>'
 +'<div class="rstat"><div class="rstat-lbl">Total Cost</div><div class="rstat-val">'+money(M.tc,0)+'</div><div class="rstat-note">Before profit</div></div>'
 +'<div class="rstat"><div class="rstat-lbl">Profit</div><div class="rstat-val green-c">'+money(pr,0)+'</div><div class="rstat-note">'+(M.tc?(pr/M.tc*100).toFixed(1):0)+'% on cost</div></div>';
 var last='',h='<thead><tr><th>Item</th><th>Qty</th><th>Cost each</th><th>Price each</th><th>Total price</th><th>Profit</th></tr></thead><tbody>';
 M.L.forEach(function(l){if(l.sec!=last){last=l.sec;h+='<tr><td colspan="6" style="background:var(--gold-pale);font-weight:800;color:var(--gold);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase">'+l.sec+' — '+money(M.sec[l.sec].s)+'</td></tr>'}
  h+='<tr><td>'+esc(l.label)+'</td><td>'+l.qty+'</td><td>'+money(l.cost)+'</td><td class="goldc">'+money(l.u)+'</td><td class="goldc">'+money(l.ts)+'</td><td class="gc">'+money(l.ts-l.tc)+'</td></tr>'});
 $('sumT').innerHTML=h+'<tr class="total-row"><td><b>TOTAL</b></td><td></td><td></td><td></td><td>'+money(M.ts)+'</td><td class="gc">'+money(pr)+'</td></tr></tbody>';
 $('pkW').style.display=M.pk.length?'':'none';
 $('pkT').innerHTML='<thead><tr><th>Room type</th><th>Hotel only / person</th><th>All selected / person</th></tr></thead><tbody>'+M.pk.map(function(p){return'<tr><td><b>'+ROOM[p.o]+'</b> (×'+p.o+')</td><td>'+money(p.hot,0)+'</td><td class="goldc">'+money(p.all,0)+'</td></tr>'}).join('')+'</tbody>'}
function tb(h,r){return'<table><thead><tr>'+h.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+r.map(function(x){return'<tr>'+x.map(function(c){return'<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>'}
function hdr(t,ref){return'<div class="ph"><div class="lgc"><img src="'+LOGO+'" alt="SAWA"></div><div class="dt"><div class="dk">'+t+'</div><div>'+ref+'</div><div>'+fd(new Date().toISOString().slice(0,10))+'</div></div></div>'}
function who(){return'<div class="box"><div><div class="lb">Customer</div><b>'+(esc(v('c_name'))||'—')+'</b><br>'+esc(v('c_phone'))+(v('c_phone')&&v('c_addr')?'<br>':'')+esc(v('c_addr'))+'</div>'
 +'<div><div class="lb">Trip</div><b>'+(esc(v('t_place'))||'—')+'</b>'+(v('nts')?' · '+num('nts')+' nights':'')+'<br>Arrival: '+fd(v('t_ad'))+' '+esc(v('t_at'))+'<br>Return: '+fd(v('t_rd'))+' '+esc(v('t_rt'))+'</div></div>'}
function tm(a,b){return(a?'Departs '+a:'')+(a&&b?' · ':'')+(b?'Arrives '+b:'')}
function offer(M){var h=hdr('TRIP OFFER','Ref. SAWA-'+new Date().toISOString().slice(2,10).replace(/-/g,''))+'<div class="pb">'+who(),S=M.sec,pp=M.L.filter(function(l){return l.sec=='Hotel'});
 var rm=[1,2,3,4].filter(function(o){return M.rooms[o]&&M.rooms[o].u>0});
 if(rm.length)h+='<div class="st">🏨 Accommodation'+(v('h_name')?' — '+esc(v('h_name')):'')+'</div>'+tb(['Room type','Price per person'],rm.map(function(o){return[ROOM[o]+' room (sharing '+o+')',money(M.rooms[o].u)]}));
 var fl=M.L.filter(function(l){return l.sec=='Flights'});
 if(fl.length)h+='<div class="st">✈️ Flights</div><div class="box"><div><div class="lb">Airline &amp; route</div><b>'+(esc(v('f_air'))||'—')+'</b><br>'+esc(v('f_from'))+' → '+esc(v('f_to'))+'</div>'
  +'<div><div class="lb">Outbound</div><b>'+esc(v('f_on'))+'</b><br>'+fd(v('f_od')||v('t_ad'))+'<br>'+tm(v('f_ot'),v('f_oa'))+'</div><div><div class="lb">Return</div><b>'+esc(v('f_rn'))+'</b><br>'+fd(v('f_rd')||v('t_rd'))+'<br>'+tm(v('f_rt'),v('f_ra'))+'</div></div>'
  +'<div style="height:8px"></div>'+tb(['Passenger','Qty','Price each','Total'],fl.map(function(l){return[l.label.replace('Flight — ',''),l.qty,money(l.u),money(l.ts)]}));
 var tr=M.L.filter(function(l){return l.sec=='Transfers'});
 if(tr.length)h+='<div class="st">🚌 Transfers</div>'+tb(['Transport','Details','Day','Time','Price'],tr.map(function(l){return[l.r.m,esc(l.r.l),fd(l.r.d),esc(l.r.t)||'—',money(l.ts)+(l.r.b=='Per person'?' ('+money(l.u)+' pp)':'')]}));
 var ex=M.L.filter(function(l){return l.sec=='Extras'});
 if(ex.length)h+='<div class="st">➕ Additional services</div>'+tb(['Item','Price'],ex.map(function(l){return[esc(l.label),money(l.ts)]}));
 h+='<div class="st">💷 Price summary</div>'+tb(['Section','Price'],Object.keys(S).map(function(k){return[k,money(S[k].s)]}))+'<div class="tot"><div class="gt"><span>Total</span><span>'+money(M.ts)+'</span></div></div>';
 if(M.pk.length)h+='<div class="st">Package price per person</div>'+tb(['Room type','Hotel only','Everything included'],M.pk.map(function(p){return[ROOM[p.o],money(p.hot,0),'<b>'+money(p.all,0)+'</b>']}));
 return h+'<ul class="nt">'+NOTES.map(function(n){return'<li>'+n+'</li>'}).join('')+'</ul></div>'+FOOT}
function rcpt(M){var inv=v('dtype')=='Invoice',paid=num('dpaid'),bal=M.ts-paid;
 return hdr(inv?'INVOICE':'RECEIPT','No. '+esc(v('dno')))+'<div class="pb">'+who()+'<div class="st">Details</div>'
 +tb(['Description','Qty','Unit price','Amount'],M.L.map(function(l){return[esc(l.label),l.qty,money(l.u),money(l.ts)]}))
 +'<div class="tot"><div class="gt"><span>Total</span><span>'+money(M.ts)+'</span></div><div><span>Amount paid'+(v('dmeth')?' ('+esc(v('dmeth'))+')':'')+'</span><b>'+money(paid)+'</b></div><div><span>Balance due</span><b>'+money(Math.max(bal,0))+'</b></div></div>'
 +(!inv&&bal<=0.005&&M.ts>0?'<div style="margin-top:16px"><span class="stamp">PAID IN FULL</span></div>':'')+'<ul class="nt">'+NOTES.slice(2).map(function(n){return'<li>'+n+'</li>'}).join('')+'</ul></div>'+FOOT}

 $('ovC').innerHTML=k=='offer'?'':'<select id="dtype"><option>Receipt</option><option>Invoice</option></select><input id="dno" placeholder="Number" value="SAWA-'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-001"><input id="dpaid" type="number" min="0" step="any" placeholder="Amount paid"><select id="dmeth"><option>Bank transfer</option><option>Card</option><option>Cash</option></select>';

 var css='@page{size:A4;margin:8mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}';

 }catch(e){window.print()}}
